<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <style>
      .brand-title { font-family: 'Epilogue', Georgia, serif; font-weight: 900; font-size: 32px; fill: #b3261e; letter-spacing: -0.5px; }
      .brand-sub { font-family: sans-serif; font-size: 11px; font-weight: 700; fill: #7f1d1d; letter-spacing: 2.5px; text-transform: uppercase; }
      .badge-bg { fill: #b3261e; }
      .badge-detail { fill: #fff8f5; }
    </style>
  </defs>
  <!-- Emblem Badge -->
  <g transform="translate(10, 8)">
    <circle cx="32" cy="32" r="30" fill="#b3261e" />
    <circle cx="32" cy="32" r="27" fill="none" stroke="#fcf2ec" stroke-width="1.5" stroke-dasharray="3,2" />
    <!-- Stylized Pizza Slice -->
    <path d="M 32 14 L 46 44 A 18 18 0 0 1 18 44 Z" fill="#fff8f5" />
    <path d="M 32 18 L 43 42 A 14 14 0 0 1 21 42 Z" fill="#e84a27" opacity="0.9" />
    <circle cx="30" cy="27" r="2.5" fill="#991b1b" />
    <circle cx="35" cy="35" r="2.2" fill="#991b1b" />
    <circle cx="26" cy="37" r="2" fill="#991b1b" />
    <!-- Chef Hat accent or Stars -->
    <path d="M 32 7 L 34 11 L 38 11 L 35 13 L 36 17 L 32 14 L 28 17 L 29 13 L 26 11 L 30 11 Z" fill="#ffb703" />
  </g>
  <!-- Brand Typography -->
  <text x="82" y="42" class="brand-title">Rae's Pizza</text>
  <text x="84" y="60" class="brand-sub">Classic Pizzeria • Est. 1984</text>
</svg>